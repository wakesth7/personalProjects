<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Container</title>
    <!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- End of Bootstrap section -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
     <!-- Begin container div -->
    <div class="container">
    <!-- Begin row div -->
    <div class="row">

      <!-- Initiate first class col-->
      <div class="col">
        <section class="intro">
          <h2>About me</h2>
          <p>Turned to coding for the fun of it.</p>
        </section>
      </div>
      <!-- Close first col class-->

      <!-- Lets add second col with contact me and a button and add an eventListener to it-->
       <div class="col">
        <section class="contact">
          <div>
          <h2>Contact</h2>
          <label for="reach_out">Please enter your email:</label>
          <input type="text" id ="reach_out" name="reach_out">
          </div>
          <!--Submit Button-->   
          <button id="submit-btn">Submit</button>  
          <!-- These will serve for the reponses to display-->
          <p id="display-emailID"></p> 
        </section>
        <script src="js/jsfile1.js" defer></script>
       </div>
      <!-- Close second col class-->

    </div>
    <!--container div-->
    </div>
    <!--class div-->
</body>
</html>
<!--Closed body and html above-->
